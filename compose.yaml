# Local development without installing Node on the host.
#   docker compose up              -> live preview at http://localhost:3000
#   docker compose run --rm site npm run build
#   docker compose run --rm site npm run serve -- --host 0.0.0.0
services:
  site:
    build: .devcontainer
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm ci && npm start -- --host 0.0.0.0"

volumes:
  node_modules:

name: github pages

# Build every PR (including Dependabot's) so breakage shows up before merging.
# Deploy only when dev is pushed.
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm

    - run: npm ci

    - name: Docusaurus Build
      run: npm run build

    - name: Deploy
      if: github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
        publish_branch: master  # deploying branch
